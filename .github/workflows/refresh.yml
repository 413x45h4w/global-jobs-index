name: Refresh job directory
on:
  schedule:
    # 06:30 UTC daily. The cron only runs on the default branch.
    - cron: "30 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull public ATS boards
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_USER_AGENT: ${{ secrets.USAJOBS_USER_AGENT }}
        run: python3 -m jobdir run
      - name: Commit append-only snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.sqlite docs/data
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "Refresh job directory [skip ci]"
            git push
          fi
